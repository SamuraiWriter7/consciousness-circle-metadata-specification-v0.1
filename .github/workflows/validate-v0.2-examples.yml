name: Validate v0.2 Examples

on:
  push:
    branches:
      - main
    paths:
      - "schemas/consciousness-circle-metadata-v0.2.schema.json"
      - "spec/consciousness-circle-metadata-specification-v0.2.yaml"
      - "examples/*v0.2.example.yaml"
      - "scripts/validate-v0.2-examples.py"
      - ".github/workflows/validate-v0.2-examples.yml"

  pull_request:
    branches:
      - main
    paths:
      - "schemas/consciousness-circle-metadata-v0.2.schema.json"
      - "spec/consciousness-circle-metadata-specification-v0.2.yaml"
      - "examples/*v0.2.example.yaml"
      - "scripts/validate-v0.2-examples.py"
      - ".github/workflows/validate-v0.2-examples.yml"

  workflow_dispatch:

jobs:
  validate-v0-2-examples:
    name: Validate v0.2 schema and examples
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema PyYAML

      - name: Validate v0.2 examples
        run: |
          python scripts/validate-v0.2-examples.py
